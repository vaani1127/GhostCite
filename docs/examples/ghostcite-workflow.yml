# Example: check every .bib file in a repository on pull requests and pushes to main.
# Copy to .github/workflows/ghostcite.yml in your own repository and add a repository
# secret named SERPAPI_API_KEY. For production, pin a release tag or a commit SHA
# instead of @main.
name: Citation check

on:
  pull_request:
    paths: ["**/*.bib"]
  push:
    branches: [main]
    paths: ["**/*.bib"]

permissions:
  contents: read
  security-events: write # needed to upload SARIF to code scanning

jobs:
  ghostcite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vaani1127/GhostCite@main
        with:
          serpapi-api-key: ${{ secrets.SERPAPI_API_KEY }}
          files: "**/*.bib"
          max-searches: "50"
          fail-on: "1" # fail when any reference is not found or has wrong metadata
