name: GhostCite citation check
description: >-
  Check BibTeX bibliographies for hallucinated or wrong citations against live Google
  Scholar data (via SerpApi) and show problems as code-scanning alerts on the exact line.
author: Vaani Prashar and Dhruv Goyal
branding:
  icon: book-open
  color: purple

inputs:
  serpapi-api-key:
    description: SerpApi API key. Always pass it from a secret, e.g. secrets.SERPAPI_API_KEY.
    required: true
  files:
    description: >-
      Space-separated glob patterns of BibTeX files to check (bash globstar syntax).
    required: false
    default: "**/*.bib"
  max-searches:
    description: Hard cap on live SerpApi searches per file (cached results are free).
    required: false
    default: "50"
  fail-on:
    description: >-
      Fail the job when at least this many references in a file are NOT_FOUND or
      METADATA_MISMATCH. Leave empty to never fail on findings.
    required: false
    default: ""
  upload-sarif:
    description: Upload the results to GitHub code scanning (needs security-events write).
    required: false
    default: "true"
  category:
    description: Code-scanning category, so GhostCite alerts do not replace other tools' alerts.
    required: false
    default: "ghostcite"
  python-version:
    description: Python version used to run GhostCite (3.11 or newer).
    required: false
    default: "3.12"

outputs:
  sarif-dir:
    description: Directory containing one SARIF file per checked bibliography.
    value: ${{ steps.check.outputs.sarif-dir }}
  files:
    description: Number of files that were checked.
    value: ${{ steps.check.outputs.files }}
  failed:
    description: "'true' when at least one file reached the fail-on threshold."
    value: ${{ steps.check.outputs.failed }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install GhostCite
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"

    # Reuse search results between runs: unchanged references cost no SerpApi credits.
    - name: Restore the search cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/ghostcite-cache
        key: ghostcite-${{ hashFiles('**/*.bib') }}
        restore-keys: ghostcite-

    # Inputs reach the script only through environment variables, never by expression
    # interpolation into the script text (GitHub's script-injection guidance), and the
    # key is never echoed.
    - name: Check citations
      id: check
      shell: bash
      env:
        SERPAPI_API_KEY: ${{ inputs.serpapi-api-key }}
        GHOSTCITE_CACHE_DIR: ${{ runner.temp }}/ghostcite-cache
        GHOSTCITE_SARIF_DIR: ${{ runner.temp }}/ghostcite-sarif
        INPUT_FILES: ${{ inputs.files }}
        INPUT_MAX_SEARCHES: ${{ inputs.max-searches }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        shopt -s globstar nullglob
        mkdir -p "$GHOSTCITE_SARIF_DIR"
        fail_args=()
        if [ -n "$INPUT_FAIL_ON" ]; then fail_args=(--fail-on "$INPUT_FAIL_ON"); fi
        read -r -a patterns <<< "$INPUT_FILES"
        count=0
        failed=false
        for pattern in "${patterns[@]}"; do
          for file in $pattern; do
            [ -f "$file" ] || continue
            count=$((count + 1))
            sarif="$GHOSTCITE_SARIF_DIR/$(printf '%s' "$file" | tr '/ ' '__').sarif"
            status=0
            ghostcite check "$file" --format sarif --output "$sarif" --sarif-uri "$file" \
              --max-searches "$INPUT_MAX_SEARCHES" --quiet ${fail_args[@]+"${fail_args[@]}"} || status=$?
            case "$status" in
              0) ;;
              1) failed=true; echo "::warning file=$file::GhostCite found problems in $file" ;;
              *) echo "::error file=$file::GhostCite could not check $file (exit code $status)"; exit "$status" ;;
            esac
            # Re-render from the cache for the job summary: no extra searches.
            if ! ghostcite check "$file" --offline --format md --quiet >> "$GITHUB_STEP_SUMMARY"; then
              echo "::warning file=$file::Could not write the job summary for $file"
            fi
          done
        done
        if [ "$count" -eq 0 ]; then echo "::warning::No files matched: $INPUT_FILES"; fi
        {
          echo "files=$count"
          echo "sarif-dir=$GHOSTCITE_SARIF_DIR"
          echo "failed=$failed"
        } >> "$GITHUB_OUTPUT"

    - name: Upload results to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.check.outputs.files != '0' && steps.check.outputs.files != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.check.outputs.sarif-dir }}
        category: ${{ inputs.category }}

    - name: Enforce the fail-on threshold
      if: ${{ steps.check.outputs.failed == 'true' }}
      shell: bash
      run: |
        echo "::error::GhostCite found citation problems at or above the fail-on threshold."
        exit 1
