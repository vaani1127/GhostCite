name: Bug report
description: A wrong verdict, a parsing problem, or a crash.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your SerpApi key**, a full SerpApi URL or
        personal data. For security problems use private vulnerability reporting instead
        (see SECURITY.md).
  - type: textarea
    id: reference
    attributes:
      label: Reference(s)
      description: The exact reference text or BibTeX entry that was checked.
      render: text
    validations:
      required: true
  - type: dropdown
    id: got
    attributes:
      label: Verdict GhostCite gave
      options: [Verified, Metadata mismatch, Not found, Unparseable, Skipped, Crash / error]
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected verdict, and why
      description: 'For example: "Verified, because the paper is in Nature 2000, DOI 10.1038/35002501".'
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason text or error message
      render: text
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [CLI, Web UI, GitHub Action, Docker]
  - type: input
    id: version
    attributes:
      label: GhostCite version, Python version and OS
      placeholder: "ghostcite --version; Python 3.12; Windows 11"
