[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ghostcite"
version = "0.1.0"
description = "Detect hallucinated and wrong academic citations by checking every reference against live Google Scholar data via SerpApi."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vaani Prashar" }, { name = "Dhruv Goyal" }]
keywords = ["citations", "hallucination", "google-scholar", "serpapi", "bibtex", "research-integrity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
# Every runtime dependency is permissively licensed and pinned for reproducibility.
dependencies = [
  "serpapi==1.1.2",          # MIT. Official SerpApi client: the only network dependency.
  "pydantic==2.13.5",        # MIT. Typed, validated domain models and JSON output.
  "pypdf==6.19.0",           # BSD-3. Pure-Python PDF text extraction (chosen over AGPL PyMuPDF).
  "bibtexparser==2.0.1",     # MIT. Tolerant BibTeX parsing that reports failed blocks.
  "rapidfuzz==3.14.6",       # MIT. Fast, deterministic fuzzy string similarity.
  "typer==0.27.2",           # MIT. Typed CLI definition.
  "rich==15.0.0",            # MIT. Readable terminal tables and progress.
  "fastapi==0.141.1",        # MIT. Local web UI and JSON API.
  "uvicorn==0.53.0",         # BSD-3. ASGI server for `ghostcite web`.
  "jinja2==3.1.6",           # BSD-3. Server-side HTML templates for the UI and HTML reports.
  "python-multipart==0.0.32", # Apache-2.0. Required by FastAPI for file uploads.
  "python-dotenv==1.2.3",    # BSD-3. Reads SERPAPI_API_KEY from a local .env file.
  "platformdirs==4.11.12",   # MIT. Correct per-OS user cache directory (never inside the repo).
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",           # MIT
  "pytest-cov==7.1.0",       # MIT
  "pytest-socket==0.8.1",    # MIT. Blocks outbound network in every test.
  "hypothesis==6.168.1",     # MPL-2.0, test-only (never shipped). Property-based tests.
  "jsonschema==4.26.0",      # MIT. Validates SARIF output against the vendored 2.1.0 schema.
  "types-jsonschema==4.26.0.20260518", # Apache-2.0. Type stubs for jsonschema (mypy --strict).
  "pyyaml==6.0.3",          # MIT. Tests parse action.yml and the example workflow.
  "types-PyYAML==6.0.12.20260906", # Apache-2.0. Type stubs for PyYAML.
  "httpx2==2.13.1",          # BSD-3. Required by Starlette's TestClient (successor to httpx).
  "mypy==2.3.1",             # MIT
  "ruff==0.16.8",            # MIT
  "pre-commit==4.6.2",       # MIT
  "reportlab==5.0.1",        # BSD. Only used by scripts/make_sample_pdf.py to generate test PDFs.
]

[project.scripts]
ghostcite = "ghostcite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostcite"]

[tool.hatch.build.targets.sdist]
include = ["src/ghostcite", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".dev"]

[tool.ruff.lint]
select = [
  "E", "W", "F",   # pycodestyle and pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplifications
  "C4",            # comprehensions
  "RET",           # return hygiene
  "PTH",           # pathlib over os.path
  "N",             # naming
  "S",             # bandit security checks
  "PT",            # pytest style
  "D",             # docstrings on public API
  "BLE",           # no blind `except Exception`
  "RUF",
]
ignore = [
  "D105",  # magic methods are self-explanatory
  "D107",  # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "S105", "S106"]
"scripts/**" = ["D103"]
"eval/**" = ["D103"]
"tasks.py" = ["S603", "S607"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts", "tasks.py"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# These packages ship without type information.
module = ["serpapi", "serpapi.*", "pytest_socket", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# --allow-hosts blocks connect() to every non-loopback address. We deliberately do NOT pass
# --disable-socket: on Windows asyncio builds its self-pipe from a loopback socketpair, so
# blocking socket creation outright would break FastAPI's TestClient.
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--allow-hosts=127.0.0.1,localhost,::1",
  "--cov=ghostcite",
  "--cov-report=term-missing:skip-covered",
]
xfail_strict = true
filterwarnings = [
  "error",
  # pytest-socket warns before raising SocketConnectBlockedError. Keep the warning visible
  # but let the real exception surface instead of turning the warning into an error.
  "default:A test tried to use socket.socket.connect:UserWarning",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["ghostcite"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.$",
]
